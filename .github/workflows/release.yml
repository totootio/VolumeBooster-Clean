name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 恢复签名密钥：与本地共用同一把，保证各版本可覆盖升级
      # secret VB_KEYSTORE_BASE64 = base64(vb.keystore)，缺失时回退为自动生成
      - name: Restore signing keystore
        env:
          VB_KEYSTORE_BASE64: ${{ secrets.VB_KEYSTORE_BASE64 }}
        run: |
          set -euxo pipefail
          if [ -n "$VB_KEYSTORE_BASE64" ]; then
            echo "$VB_KEYSTORE_BASE64" | base64 -d > vb.keystore
            sha256sum vb.keystore
          else
            echo "::warning::VB_KEYSTORE_BASE64 secret not set, a throwaway key will be generated"
          fi

      # 不依赖 runner 预装 SDK：直接下载官方 cmdline-tools，固定路径安装所需组件
      - name: Set up Android SDK
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          curl -fsSL -o /tmp/clt.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/clt && mkdir -p /tmp/clt
          unzip -q /tmp/clt.zip -d /tmp/clt
          yes | /tmp/clt/cmdline-tools/bin/sdkmanager --sdk_root="${ANDROID_HOME}" --licenses \
            > /dev/null 2>&1 || true
          /tmp/clt/cmdline-tools/bin/sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platforms;android-33" "build-tools;33.0.2"
          ls "${ANDROID_HOME}/build-tools"

      - name: Build APK
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh

      - name: Rename APK with tag
        run: mv VolumeBooster_Clean.apk "VolumeBooster_Clean_${GITHUB_REF_NAME}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: VolumeBooster_Clean_*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 沙箱网络只能读 GitHub API（日志走 blob 存储被代理拦截），
      # 失败时自动建 Issue 回传诊断信息
      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI 失败诊断"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo '```'
            ls "${ANDROID_HOME}" 2>&1 || true
            ls "${ANDROID_HOME}/build-tools" 2>&1 || true
            ls "${ANDROID_HOME}/platforms" 2>&1 || true
            echo '```'
          } > diag.md
          gh issue create --title "CI failure diagnostics ($GITHUB_RUN_ID)" \
            --body-file diag.md || true
